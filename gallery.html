<!doctype html><meta charset="utf-8"><title>motion-showcase 效果展示</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark}
html,body{margin:0;background:#f4f1ea;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#222}
@media (prefers-color-scheme:dark){html,body{background:#161514;color:#eee}}
header{padding:28px 20px 8px;max-width:1200px;margin:auto}
h1{font-size:26px;margin:0 0 6px}p.sub{margin:0;opacity:.7;font-size:15px}
nav{position:sticky;top:0;z-index:5;background:inherit;padding:10px 20px;max-width:1200px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{font-size:14px;padding:6px 12px;border-radius:99px;background:#0001;color:inherit;text-decoration:none}
section{max-width:1200px;margin:auto;padding:8px 20px 20px}
h2{font-size:20px;margin:22px 0 4px}p.note{margin:0 0 12px;opacity:.65;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:center}
.view{position:relative;overflow:hidden;border-radius:12px;background:#efe9dd;box-shadow:0 0 0 1px #0002;width:100%}
.view .in{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.view div,.view img,.view svg{position:absolute}
.view .wg>div,.view .wg div{position:absolute}
.view .wg>div:first-child{position:relative}
.name{margin-top:8px;font-size:15px;font-weight:600;text-align:center}
</style>
<header><h1>motion-showcase 效果展示</h1><p class="sub">雙擊這個檔案就能看，每個效果都會自己動，下面都有名字。</p></header>
<nav id="nav"></nav><div id="app"></div>
<script src="lib/widgets.js"></script><script src="lib/widgets2.js"></script><script src="lib/widgets3.js"></script><script src="lib/widgets-all.js"></script><script src="lib/names.js"></script><script src="lib/motion.js"></script>
<script>
// 展示頁專用：用時間迴圈播放。效果本身只看時間 t，這裡只是讓 t 一直往前走。
const ENAMES=ENTER.map(x=>x[0]),BNAMES=BREAK.map(x=>x[0]),ANAMES=ARR.map(x=>x[0]),CNAMES=CAMS.map(x=>x[0]);
const TNAMES={ink:'墨水擴散',blinds:'橫百葉',vblinds:'直百葉',whip:'甩鏡',punch:'衝擊放大',glitch:'故障位移',flash:'閃白',iris:'圓形擴張',rgb:'色散切換'};
const TKEYS=Object.keys(TRX);
const frame=(kind,i,t)=>{GT=t;html='';
 if(kind==='widget'){html='';cream();P(wg(i,t,{x:WX,y:WY,w:760}))}
 else if(kind==='enter'){cream();const L=1.6,tt=t%L;P(ENTER[i][1](1+i*2,tt,c01(tt/.38)))}
 else if(kind==='break'){cream();const L=1.4,tt=t%L;const k=1+i*2,C=one(k,tt);P(tt<.12?C:BREAK[i][1](C,c01((tt-.12)/.38),k,tt))}
 else if(kind==='arrange'){cream();ARR[i][1](t%3)}
 else if(kind==='camera'){cream();CAMS[i][1](t%1.8)}
 else{const n=TKEYS[i],L=1.6,p=c01(((t%L)-.3)/.8);const A=cap(()=>{cream();P(wg(1,t,{x:WX,y:WY,w:760}))}),B=cap(()=>{cream();P(wg(9,t,{x:WX,y:WY,w:760}))});P(TRX[n](A,B,p))}
 return html};
const groups=[
 ['widget','動態元件','會動的小卡片，72 個',WALL_NAMES.map((n,i)=>[n,i]),'wide'],
 ['enter','進場','元件怎麼出現',ENAMES.map((n,i)=>[n,i])],
 ['break','破壞特效','元件怎麼被拆掉',BNAMES.map((n,i)=>[n,i])],
 ['arrange','排列','多個元件怎麼排',ANAMES.map((n,i)=>[n,i])],
 ['camera','鏡頭運動','整個畫面怎麼動',CNAMES.map((n,i)=>[n,i])],
 ['trans','轉場','兩個畫面怎麼切換',TKEYS.map((k,i)=>[TNAMES[k],i])]];
const app=document.getElementById('app'),nav=document.getElementById('nav'),cells=[];
groups.forEach(([kind,title,note,items,wide],gi)=>{
 const s=document.createElement('section');s.id='g'+gi;s.innerHTML=`<h2>${title}（${items.length}）</h2><p class="note">${note}</p><div class="grid"></div>`;app.appendChild(s);
 const a=document.createElement('a');a.href='#g'+gi;a.textContent=title;nav.appendChild(a);
 const grid=s.querySelector('.grid');
 items.forEach(([name,i])=>{
  const c=document.createElement('div');c.className='card';
  const v=document.createElement('div');v.className='view';
  const W=200,sc=wide?0.3:0.19;const crop=wide?{x:140,y:640,w:800,h:520}:{x:0,y:480,w:1080,h:960};
  const full=kind==='arrange'||kind==='camera'||kind==='trans';
  const cr=full?{x:0,y:300,w:1080,h:1320}:crop;
  v.style.aspectRatio=cr.w+'/'+cr.h;
  const inn=document.createElement('div');inn.className='in';v.appendChild(inn);
  c.appendChild(v);const nm=document.createElement('div');nm.className='name';nm.textContent=name;c.appendChild(nm);grid.appendChild(c);
  cells.push({kind,i,v,inn,cr,vis:false,sc:0});
 });
});
const io=new IntersectionObserver(es=>es.forEach(e=>{const c=cells.find(x=>x.v===e.target);if(c)c.vis=e.isIntersecting}),{rootMargin:'100px'});
cells.forEach(c=>io.observe(c.v));
const draw=(c,t)=>{const sc=c.v.clientWidth/c.cr.w;c.inn.style.transform=`scale(${sc}) translate(${-c.cr.x}px,${-c.cr.y}px)`;try{c.inn.innerHTML=frame(c.kind,c.i,t)}catch(e){}};
cells.forEach(c=>draw(c,0.9));
let last=0;
const loop=ts=>{if(ts-last>60){last=ts;const t=ts/1000;
 cells.forEach(c=>{if(c.vis)draw(c,t)})}
 requestAnimationFrame(loop)};
requestAnimationFrame(loop);
</script>
