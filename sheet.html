<!doctype html><meta charset="utf-8"><title>sheet</title>
<style>
html,body{margin:0;background:#f4f1ea;font-family:-apple-system,"PingFang TC",sans-serif}
#g{display:flex;flex-wrap:wrap;gap:14px;padding:14px}
.c{position:relative;overflow:hidden;background:#efe9dd;border-radius:10px;box-shadow:0 0 0 1px #0002}
.c .in{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.c div,.c img,.c svg{position:absolute}
.c .wg>div,.c .wg div{position:absolute}
.c .wg>div:first-child{position:relative}
.cap{position:relative!important;font:600 15px/1.3 -apple-system,"PingFang TC";color:#222;text-align:center;margin-top:4px}
.item{display:flex;flex-direction:column;align-items:center}
.lab{font:600 16px/1.3 -apple-system,"PingFang TC";color:#222;margin-top:6px;text-align:center;max-width:300px}
</style>
<div id="g"></div>
<script src="lib/widgets.js"></script><script src="lib/widgets2.js"></script><script src="lib/widgets3.js"></script><script src="lib/widgets4.js"></script><script src="lib/widgets-all.js"></script><script src="lib/motion.js"></script>
<script>
const q=new URLSearchParams(location.search),type=q.get('type'),from=+(q.get('from')||0),to=+(q.get('to')||999);
const names={enter:ENTER.map(x=>x[0]),break:BREAK.map(x=>x[0]),arrange:ARR.map(x=>x[0]),camera:CAMS.map(x=>x[0]),transition:Object.keys(TRX)};
const render=(ty,i,t)=>{GT=t;html='';
 if(ty==='widget')P(full('background:#efe9dd'),'')||0;
 if(ty==='widget'){html='';cream();P(wg(i,t,{x:WX,y:WY,w:760}))}
 else if(ty==='mat'){html='';cream();P(`<div class="wg" style="left:${WX-230}px;top:${WY-115}px;transform-origin:0 0">${WALL4[i][0](t)}</div>`)}
 else if(ty==='enter'){cream();P(ENTER[i][1](1+i*2,t,c01(t/.38)))}
 else if(ty==='break'){cream();const C=one(1+i*2,0);P(BREAK[i][1](C,c01(t/.38),1+i*2,t))}
 else if(ty==='arrange'){cream();ARR[i][1](t)}
 else if(ty==='camera'){cream();CAMS[i][1](t)}
 else if(ty==='transition'){const n=Object.keys(TRX)[i];const A=cap(()=>{cream();P(wg(1,t,{x:WX,y:WY,w:760}))}),B=cap(()=>{cream();P(wg(9,t,{x:WX,y:WY,w:760}))});P(TRX[n](A,B,c01(t)))}
 return html};
const g=document.getElementById('g');
const add=(ty,i,t,label,sc,crop)=>{const it=document.createElement('div');it.className='item';const c=document.createElement('div');c.className='c';
 if(crop){c.style.width=crop.w*sc+'px';c.style.height=crop.h*sc+'px'}else{c.style.width=1080*sc+'px';c.style.height=1920*sc+'px'}
 const inn=document.createElement('div');inn.className='in';inn.style.transform=`scale(${sc}) translate(${crop?-crop.x:0}px,${crop?-crop.y:0}px)`;inn.innerHTML=render(ty,i,t);c.appendChild(inn);it.appendChild(c);
 const l=document.createElement('div');l.className='lab';l.textContent=label;it.appendChild(l);g.appendChild(it)};
const TS=(q.get('ts')||'0.3').split(',').map(Number);
if(type==='widget'){const n=WALL.length;for(let i=from;i<Math.min(to,n);i++)add('widget',i,1.2,'#'+i,.34,{x:140,y:640,w:800,h:520})}
else if(type==='mat'){for(let i=from;i<Math.min(to,WALL4.length);i++)add('mat',i,1.2,'材質 #'+i,.34,{x:140,y:640,w:800,h:520})}
else{const nm=names[type];for(let i=0;i<nm.length;i++){TS.forEach((t,j)=>add(type,i,t,j===0?`${i} ${nm[i]}`:'',.2,(type==='enter'||type==='break')?{x:0,y:520,w:1080,h:760}:null))}}
</script>
